<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hospital Management System</title>

<style>

body{
    font-family:Arial,sans-serif;
    margin:0;
    background:#f4f6f9;
}

header{
    background:#0d6efd;
    color:white;
    padding:20px;
    text-align:center;
}

nav{
    background:#084298;
    padding:15px;
}

nav a{
    color:white;
    text-decoration:none;
    margin:20px;
    font-size:18px;
}

.container{
    width:80%;
    margin:auto;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-top:20px;
    border-radius:10px;
    box-shadow:0px 0px 10px lightgray;
}

input{
    width:90%;
    padding:10px;
    margin:10px 0;
    border:1px solid gray;
    border-radius:5px;
}

button{
    padding:12px 20px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

th{
    background:#0d6efd;
    color:white;
}

th,td{
    border:1px solid gray;
    padding:10px;
    text-align:center;
}

</style>

</head>

<body>

<header>

<h1>Hospital Management System</h1>

</header>

<nav>

<a href="#">Dashboard</a>

<a href="#">Patients</a>

<a href="#">Doctors</a>

<a href="#">Appointments</a>

<a href="#">Billing</a>

</nav>

<div class="container">

<div class="card">

<h2>Patient Registration</h2>

<form onsubmit="return addPatient()">

<input type="text"
id="name"
placeholder="Patient Name">

<input type="number"
id="age"
placeholder="Age">

<input type="text"
id="disease"
placeholder="Disease">

<input type="text"
id="doctor"
placeholder="Doctor Name">

<button type="submit">

Add Patient

</button>

</form>

</div>

<div class="card">

<h2>Patient Records</h2>

<table>

<thead>

<tr>

<th>Name</th>

<th>Age</th>

<th>Disease</th>

<th>Doctor</th>

</tr>

</thead>

<tbody id="patients">

</tbody>

</table>

</div>

</div>

<script>

function addPatient(){

event.preventDefault();

let name =
document.getElementById("name").value;

let age =
document.getElementById("age").value;

let disease =
document.getElementById("disease").value;

let doctor =
document.getElementById("doctor").value;

if(name=="" ||
age=="" ||
disease=="" ||
doctor==""){

alert("Please Fill All Fields");

return false;

}

let row =

"<tr>" +

"<td>"+name+"</td>" +

"<td>"+age+"</td>" +

"<td>"+disease+"</td>" +

"<td>"+doctor+"</td>" +

"</tr>";

document.getElementById("patients")

.innerHTML += row;

document.getElementById("name").value="";

document.getElementById("age").value="";

document.getElementById("disease").value="";

document.getElementById("doctor").value="";

alert("Patient Added Successfully");

return false;

}

</script>

</body>

</html>
